[project]
name = "umbrella-animal-biohub"
version = "0.1.0"
description = "Multi-agent AI platform for animal biology"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "langchain-openai>=1.4.1",
    "langchain-nvidia-ai-endpoints",
    "langgraph>=0.2",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "annotated-doc==0.0.5",
    "biopython==1.84",
    "click==8.4.2",
    "fastapi==0.141.1",
    "filelock==3.32.2",
    "fsspec==2026.7.0",
    "huggingface-hub==0.36.2",
    "jinja2==3.1.6",
    "markupsafe==3.0.3",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "numpy==2.5.1",
    "pip==24.2",
    "safetensors==0.8.0",
    "setuptools==83.0.0",
    "sortedcontainers==2.4.0",
    "starlette==1.4.1",
    "sympy==1.14.0",
    "tokenizers==0.20.3",
    "torch==2.4.1",
    "transformers==4.46.3",
    "uvicorn==0.52.1"
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis==6.165.2"
]
