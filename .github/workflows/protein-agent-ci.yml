name: Protein Agent CI

on:
  push:
    branches: [Group_B, main]
    paths:
      - "backend/agents/Protein_visualization/**"
      - ".github/workflows/protein-agent-ci.yml"
  pull_request:
    branches: [Group_B, main]
    paths:
      - "backend/agents/Protein_visualization/**"
      - ".github/workflows/protein-agent-ci.yml"
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/agents/Protein_visualization/requirements*.txt
      - name: Install dependencies
        working-directory: backend/agents/Protein_visualization
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check backend/agents/Protein_visualization
      - name: Format check
        run: ruff format --check backend/agents/Protein_visualization
      - name: Type check
        run: mypy --config-file backend/agents/Protein_visualization/mypy.ini backend/agents/Protein_visualization/app
      - name: Offline tests
        run: pytest backend/agents/Protein_visualization/tests -q -m "not live and not bge and not qdrant"
