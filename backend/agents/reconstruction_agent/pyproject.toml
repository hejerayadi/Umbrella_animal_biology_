[project]
name = "reconstruction-agent"
version = "0.1.0"
description = "Umbrella Reconstruction Agent - reconstructs unresolved regions of incomplete animal genomes."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Agent API layer - required by the orchestrator contract, do not remove.
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Agent graph.
    "langgraph>=0.2.45",
    "langchain-core>=0.3.15",
    # External service access (NCBI, EMBL-EBI BLAST/MAFFT).
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "structlog>=26.1.0",
    "rich>=15.0.0",
    "asgi-correlation-id>=5.0.1",
    "python-multipart>=0.0.32",
    "sse-starlette>=3.4.8",
    "langgraph-checkpoint-postgres>=3.1.2",
    "sqlalchemy>=2.0",
    "alembic>=1.19.1",
    "psycopg[binary,pool]>=3.3.4",
]
# Note: no biopython/numpy. Sequence handling here is plain string work and the
# FASTA parsing is hand-rolled (see tools/ncbi/mapper.py), so neither is used
# yet. Add them with `uv add` when something actually needs them rather than
# carrying unused pins.

[project.scripts]
# Run the agent standalone with `uv run reconstruction-agent`.
#
# Not `python -m api`: the launcher shim `api.py` sits at the agent root, and
# with the agent root as cwd it shadows the installed `api` package. A console
# script is resolved from the venv instead, so the collision cannot arise.
reconstruction-agent = "api.__main__:main"

[project.optional-dependencies]
llm = [
    "langchain-openai>=0.2.5",
]
observability = [
    "langsmith>=0.1.140",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
    "ruff>=0.7.3",
    "mypy>=1.13.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat src layout: these are the top-level packages, plus the prompt markdown
# they load at runtime. Listing them explicitly (rather than packaging `src`)
# is what keeps the import names `api`, `domain`, ... instead of `src.api`.
packages = [
    "src/agent",
    "src/api",
    "src/application",
    "src/configuration",
    "src/contracts",
    "src/domain",
    "src/infrastructure",
    "src/observability",
    "src/prompts",
    "src/tools",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing:skip-covered --cov-report=xml"
markers = [
    "external: hits a real external service; skipped unless RUN_EXTERNAL_TESTS=1",
    "evaluation: scores reconstruction quality against a fixture set; slow",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '^\s*\.\.\.$',
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # `Depends(...)` in an argument default is FastAPI's dependency-injection
    # idiom, not the mutable-default bug this rule targets.
    "B008",
    # `class X(str, Enum)` is deliberate: it keeps these enums JSON-serialisable
    # by pydantic and matches the shared agent contract in
    # backend/orchestrator/schema.py. StrEnum would diverge from it.
    "UP042",
]

[tool.mypy]
python_version = "3.11"
packages = [
    "agent",
    "api",
    "application",
    "configuration",
    "contracts",
    "domain",
    "infrastructure",
    "observability",
    "tools",
]
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
# Optional extras: present only when installed with `uv sync --extra llm`, and
# imported lazily behind a try/except so their absence is a supported state.
module = ["langchain_openai.*", "langgraph.*", "asgi_correlation_id.*"]
ignore_missing_imports = true
