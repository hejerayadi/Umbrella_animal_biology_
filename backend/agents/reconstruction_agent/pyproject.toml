[project]
name = "reconstruction-agent"
version = "0.1.0"
description = "Umbrella Reconstruction Agent - evidence-driven reconstruction of unresolved genomic regions."
requires-python = ">=3.12"
dependencies = [
    "aiolimiter>=1.2.1",
    "biopython>=1.88",
    "cachetools>=6.2.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.18",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "langsmith>=0.11.1",
    "numpy>=2.5.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "hypothesis>=6.165.10",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

# The importable package is `reconstruction_agent`, living under src/. It IS
# built and installed into this agent's own .venv, because backend/run_agents.py
# launches every agent as `backend.agents.<folder>.api:app` from the repository
# root - so `src/` is never on sys.path and the shim could not import it
# otherwise.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reconstruction_agent"]
artifacts = ["src/reconstruction_agent/agent/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src" for the package under test, "." so `tests.fakes` is importable from any
# test module rather than only from its own directory.
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "external: hits a real external service; skipped unless RUN_EXTERNAL_TESTS=1",
    "evaluation: scores reconstruction quality against a fixture set; slow",
]

[tool.ruff]
src = ["src"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's dependency injection is expressed as `Depends(...)` in a
#       default argument; the rule cannot tell it from a real mutable default.
# UP042: `class X(str, Enum)` is kept over `StrEnum` because the orchestrator
#        serialises these values to JSON and compares them by `.value`.
ignore = ["B008", "UP042"]

[tool.mypy]
mypy_path = "src"
# The agent directory is itself importable as backend.agents.reconstruction_agent,
# so without this mypy finds every module under two names and refuses to start.
explicit_package_bases = true
namespace_packages = true
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
exclude = "(tests|scripts)/"
