[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# No URL here on purpose. `migrations/env.py` reads it from the agent's own
# settings (RECONSTRUCTION_DATABASE_URL), so the migration and the running
# agent can never point at different databases - and no credential is ever
# committed to this file.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
