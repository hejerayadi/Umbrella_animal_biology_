[pytest]
# `backend/` on sys.path, so `agents.Literature_Agent...` imports resolve when
# pytest is run from this directory as the test docstrings describe. Without
# it the suite only collected when run from `backend/`.
pythonpath = ../..
testpaths = tests

# Deselected by default: these hit live Azure OpenAI and assert on the replies,
# so they fail offline for reasons that have nothing to do with the code under
# test. Run them explicitly with `pytest -m integration`.
addopts = -m "not integration"
markers =
    integration: needs live Azure OpenAI / Qdrant credentials
