services:
  trait-discovery-agent:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    command: pytest tests/test_llm_smoke.py -v

  create-collections:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    command: python scripts/create_collections.py

  retrieval-quality:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    command: python scripts/test_retrieval_quality.py

  test-retrieval:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    command: pytest tests/test_retrieval.py -v -s

  test-integration:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    command: pytest tests/integration -v -s

  orchestration-retrieval-scenarios:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    command: python -m scripts.orchestration_retrieval_scenarios --scenario all --verbose

  demo-full-integration:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    command: python -m scripts.demo_full_integration --verbose

  demo-live-integration:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    command: python -m scripts.demo_live_integration --verbose

  # -------------------------------------------------------------------------
  # NEW: Pathways Agent services
  # -------------------------------------------------------------------------
  pathways-agent:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    command: python -m scripts.check_pathways

  test-pathways:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    command: pytest tests/test_pathways.py -v -s


  # -------------------------------------------------------------------------
  # Gene Mapper Agent service
  # -------------------------------------------------------------------------
  gene-mapper-agent:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    command: python -m scripts.check_gene_mapper