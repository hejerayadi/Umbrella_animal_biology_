services:
  trait-discovery-agent:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    command: pytest tests/test_llm_smoke.py -v

  create-collections:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    command: python scripts/create_collections.py

  retrieval-quality:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    command: python scripts/test_retrieval_quality.py

  test-retrieval:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    command: pytest tests/test_retrieval.py -v -s

  test-integration:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    command: pytest tests/integration -v -s