# ─────────────────────────────────────────────────────────────────
# CATEGORY 7 — Simulated tool failure / degradation
# ─────────────────────────────────────────────────────────────────

- id: tool_failure_ncbi_timeout
  input: "What is the genome size of the domestic cat?"
  species_hint: "Felis catus"
  expected_path: [query_router, species_resolver, parallel_kickoff,
                  get_genome_metadata, get_gene_annotation, join_parallel,
                  explanation_writer]
  expected_tool_calls: [ncbi_taxonomy_search, ncbi_assembly_lookup, ncbi_assembly_stats]
  expected_output_fields: []
  expected_escalation: false
  simulate_failure: {tool: ncbi_assembly_stats, error: TimeoutError}
  expected_graceful_degradation: true
  category: tool_failure
  notes: "Metadata node should return errors list and continue, not crash the graph"

- id: tool_failure_gene_annotation_timeout
  input: "List genes in the domestic cat genome"
  species_hint: "Felis catus"
  expected_path: [query_router, species_resolver, parallel_kickoff,
                  get_genome_metadata, get_gene_annotation, join_parallel,
                  explanation_writer]
  expected_tool_calls: [ncbi_taxonomy_search, ncbi_assembly_lookup, ncbi_gene_list]
  expected_output_fields: [assembly_id, scientific_name]
  expected_escalation: false
  simulate_failure: {tool: ncbi_gene_list, error: TimeoutError}
  expected_graceful_degradation: true
  category: tool_failure
  notes: "Gene annotation node should return empty gene_list, not an exception"

- id: tool_failure_species_resolver_network_error
  input: "What is the genome size of the African lion?"
  species_hint: "Panthera leo"
  expected_path: [query_router, species_resolver, error_end]
  expected_tool_calls: [ncbi_taxonomy_search]
  expected_output_fields: []
  expected_escalation: false
  simulate_failure: {tool: ncbi_taxonomy_search, error: ConnectionError}
  expected_graceful_degradation: true
  expected_error_end: true
  category: tool_failure
  notes: "If species resolver network call fails, must route to error_end gracefully"
