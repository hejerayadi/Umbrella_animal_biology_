# Genome Agent — Evaluation Dataset
# Sprint 4 · 28 cases across 7 categories
# Format mirrors the guide spec exactly.

# ─────────────────────────────────────────────────────────────────
# CATEGORY 1 — Happy path  (unambiguous species, complete assembly)
# ─────────────────────────────────────────────────────────────────

- id: happy_human_genome_size
  input: "What is the genome size of humans?"
  species_hint: "human"
  expected_path: [query_router, species_resolver, parallel_kickoff,
                  get_genome_metadata, get_gene_annotation, join_parallel,
                  explanation_writer]
  expected_tool_calls: [ncbi_taxonomy_search, ncbi_assembly_lookup, ncbi_assembly_stats]
  expected_output_fields: [assembly_id, scientific_name, genome_size]
  expected_escalation: false
  category: happy_path

