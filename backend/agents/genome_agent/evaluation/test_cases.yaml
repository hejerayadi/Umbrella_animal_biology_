# ─────────────────────────────────────────────────────────────────
# CATEGORY 3 — Scaffold/Contig assembly → must escalate
# ─────────────────────────────────────────────────────────────────

- id: scaffold_amur_tiger
  input: "What is the genome sequence of the Amur tiger?"
  species_hint: "Amur tiger"
  expected_path: [query_router, species_resolver, parallel_kickoff,
                  get_genome_metadata, get_gene_annotation, join_parallel,
                  reconstruction_resolver, explanation_writer]
  expected_tool_calls: [ncbi_taxonomy_search, ncbi_assembly_lookup, ncbi_assembly_stats]
  expected_output_fields: [assembly_id, scientific_name]
  expected_escalation: true
  category: scaffold_escalation
  notes: "GCF_000464555.1 is Scaffold level — must set reconstruction_need"

- id: scaffold_snow_leopard
  # NOTE: originally "Panthera uncia" (GCF_023721935.1). Live NCBI now
  # reports that assembly as Chromosome-level (it was RefSeq-annotated at
  # chromosome level as of the 2022 Armstrong et al. publication — this
  # case predates that, or was written from stale data). Swapped species
  # to Amur tiger (GCF_000464555.1), which the scaffold_amur_tiger case
  # in this same file confirms is still Scaffold-level on live NCBI, so
  # this case actually exercises the reconstruction path again.
  input: "Give me the complete genome of the Amur tiger, including any gaps"
  species_hint: "Amur tiger"
  expected_path: [query_router, species_resolver, parallel_kickoff,
                  get_genome_metadata, get_gene_annotation, join_parallel,
                  reconstruction_resolver, explanation_writer]
  expected_tool_calls: [ncbi_taxonomy_search, ncbi_assembly_lookup, ncbi_assembly_stats]
  expected_output_fields: [assembly_id, scientific_name]
  expected_escalation: true
  category: scaffold_escalation
  notes: "Scaffold-level assembly should always trigger reconstruction path"

