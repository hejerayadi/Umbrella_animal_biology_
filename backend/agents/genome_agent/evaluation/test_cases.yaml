# ─────────────────────────────────────────────────────────────────
# CATEGORY 5 — Nonexistent / misspelled species → must hit error_end
# ─────────────────────────────────────────────────────────────────

- id: nonexistent_fabricated_species
  input: "What is the genome of Draconus mythicus?"
  species_hint: "Draconus mythicus"
  expected_path: [query_router, species_resolver, error_end]
  expected_tool_calls: [ncbi_taxonomy_search]
  expected_output_fields: []
  expected_escalation: false
  expected_error_end: true
  category: nonexistent_species
  notes: "Fabricated binomial — must hit error_end, never return a genome"

- id: nonexistent_typo_species
  # NOTE: originally expected this one-letter typo ("tigriz" vs "tigris")
  # to fail resolution entirely (expected_error_end: true). Live runs show
  # the resolver does exactly what system-prompt Rule 3 tells it to do —
  # reformulate once, find "Panthera tigris" via search_taxonomy, and
  # ground a real assembly_id from search_assembly_by_taxid for it. That's
  # correct, intended behavior (not a fabricated/ungrounded guess — see
  # Rule 7), so forcing error_end here would be penalizing the resolver
  # for successfully doing its job. Re-pointed this case at recognizing a
  # successful reformulation instead, and moved it out of
  # nonexistent_species (whose category median assumes ~1 tool call before
  # error_end — a resolved case here would always trip check_efficiency)
  # into ambiguous_species, where a multi-tool-call resolution is the norm.
  input: "Genome of Panthera tigriz"
  species_hint: "Panthera tigriz"
  expected_path: [query_router, species_resolver, parallel_kickoff,
                  get_genome_metadata, get_gene_annotation, join_parallel,
                  explanation_writer]
  expected_tool_calls: [ncbi_taxonomy_search, ncbi_assembly_lookup, ncbi_assembly_stats]
  expected_output_fields: [assembly_id, scientific_name, genome_size]
  expected_escalation: false
  category: ambiguous_species
  notes: "One-letter typo — resolver must reformulate once and ground a real assembly, not fabricate or give up"

- id: nonexistent_nonsense_string
  input: "Tell me about the genome of xkcdwombat9999"
  species_hint: "xkcdwombat9999"
  expected_path: [query_router, species_resolver, error_end]
  expected_tool_calls: [ncbi_taxonomy_search]
  expected_output_fields: []
  expected_escalation: false
  expected_error_end: true
  category: nonexistent_species

- id: nonexistent_plausible_misspell
  # NOTE: same situation as nonexistent_typo_species above (see its note)
  # — this double-l typo in "musculus" is close enough that the resolver's
  # own Rule 3 reformulation correctly recovers "Mus musculus" and grounds
  # a real assembly, rather than fabricating or giving up. Re-pointed at
  # that success and moved out of nonexistent_species for the same
  # category-median reason (see nonexistent_typo_species's note).
  input: "What genes does Mus muscullus have?"
  species_hint: "Mus muscullus"
  expected_path: [query_router, species_resolver, parallel_kickoff,
                  get_genome_metadata, get_gene_annotation, join_parallel,
                  explanation_writer]
  expected_tool_calls: [ncbi_taxonomy_search, ncbi_assembly_lookup,
                        ncbi_assembly_stats, ncbi_gene_list]
  expected_output_fields: [assembly_id, scientific_name, gene_list]
  expected_escalation: false
  category: ambiguous_species
  notes: "Double-l typo in musculus — resolver must reformulate once and ground a real assembly, not fabricate or give up"

